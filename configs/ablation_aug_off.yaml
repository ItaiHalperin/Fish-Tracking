name: ablation_aug_off
model_type: multihead

# Augmentation ablation — OFF arm. Resize + normalize only. Everything else
# (backbone, class-balanced loss, weighted sampler, epochs, seed) matches the ON
# arm, so the only variable is augmentation. Tests the mentor's question: does
# augmentation help the rare classes?
data_dir: labels_split
backbone: resnet34
epochs: 50
imgsz: 224
batch: 32
lr0: 0.0003
weight_decay: 0.0002
patience: 12
seed: 42
device: mps
num_workers: 4

loss: class_balanced
cb_beta: 0.999
weighted_sampler: true
dropout: 0.0
label_smoothing: 0.0

aug:
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  fliplr: 0.0
  flipud: 0.0
  erasing: 0.0
  mixup: 0.0

notes: "Ablation OFF: no augmentation (resize+normalize only)."
