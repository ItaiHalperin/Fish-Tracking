name: multihead_reg
model_type: multihead
pretrained: yolo11n-cls.pt
data_dir: labels
epochs: 60
imgsz: 224
batch: 32
lr0: 0.0003
patience: 15
seed: 42
device: mps
aug:
  degrees: 12.0
  translate: 0.1
  scale: 0.3
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  fliplr: 0.5
  flipud: 0.0
  mosaic: 0.0
  erasing: 0.4
  mixup: 0.2
  cardinal_rotation: false
notes: 'Regularization bundle: dropout 0.3, label-smooth 0.05, mixup 0.2, wd 5e-4,
  freeze 5 ep, +TTA.'
backbone: resnet34
weight_decay: 0.0005
num_workers: 4
loss: class_balanced
cb_beta: 0.999
focal_gamma: 2.0
weighted_sampler: true
dropout: 0.3
label_smoothing: 0.05
freeze_epochs: 5
tta: true
abstain_threshold: 0.0
