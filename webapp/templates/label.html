<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fish crop labeler</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0; }
    #stats { font-size: 13px; color: #aaa; }
    #stats a { color: #6cf; }
    #image-wrap { background: #000; padding: 12px; border-radius: 8px; text-align: center; min-height: 400px; display: flex; align-items: center; justify-content: center; }
    #image-wrap img { max-width: 100%; max-height: 70vh; image-rendering: -webkit-optimize-contrast; }
    #buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    button { padding: 10px 14px; font-size: 14px; background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 90px; }
    button:hover { background: #3a3a3a; }
    button .ref { width: 64px; height: 64px; object-fit: contain; background: #fff; border-radius: 4px; }
    button .ref-placeholder { width: 64px; height: 64px; background: #1a1a1a; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #555; font-size: 11px; }
    button .label-row { display: flex; align-items: center; gap: 4px; font-size: 13px; }
    button .key { color: #6cf; font-weight: bold; }
    #undo { background: #4a2a2a; }
    #counts { margin-top: 16px; font-size: 12px; color: #888; }
    #counts span { margin-right: 12px; }
    #filename { font-family: monospace; font-size: 11px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Fish crop labeler</h1>
    <div id="stats">Loading… &middot; <a href="/finish">Finish &rarr;</a></div>
  </header>

  <div id="image-wrap"><img id="img" alt=""></div>
  <div id="filename"></div>

  <div id="buttons"></div>
  <button id="undo" style="margin-top: 12px;">↶ Undo (U)</button>

  <div id="counts"></div>

<script>
const CLASSES = {{ classes | tojson }};
let queue = [];
let current = null;

async function refillQueue() {
  const r = await fetch("/api/queue?n=50");
  const j = await r.json();
  queue = j.files;
  updateStats(j.remaining, null);
}

function updateStats(remaining, counts) {
  document.getElementById("stats").innerHTML =
    `${remaining} unlabeled remaining &middot; <a href="/finish">Finish &rarr;</a>`;
  if (counts) {
    document.getElementById("counts").innerHTML =
      Object.entries(counts).map(([k, v]) => `<span><b>${k}</b>: ${v}</span>`).join("");
  }
}

function showNext() {
  if (queue.length === 0) {
    document.getElementById("img").src = "";
    document.getElementById("filename").textContent = "";
    document.getElementById("image-wrap").innerHTML =
      "<div>All done in this batch. <button onclick='refillQueue().then(showNext)'>Reload</button> or <a href='/finish' style='color:#6cf'>Finish</a>.</div>";
    return;
  }
  current = queue.shift();
  document.getElementById("img").src = `/source/${encodeURIComponent(current)}`;
  document.getElementById("filename").textContent = current;
}

async function label(cls) {
  if (!current) return;
  const r = await fetch("/api/label", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: current, class: cls }),
  });
  const j = await r.json();
  if (j.error) { alert(j.error); return; }
  updateStats(j.remaining, j.counts);
  if (queue.length < 5) await refillQueue();
  showNext();
}

async function undo() {
  const r = await fetch("/api/undo", { method: "POST" });
  const j = await r.json();
  if (j.error) { alert(j.error); return; }
  updateStats(j.remaining, j.counts);
  // Put restored file at front of queue so user re-sees it
  queue.unshift(j.restored.filename);
  showNext();
}

function buildButtons() {
  const wrap = document.getElementById("buttons");
  CLASSES.forEach((cls, i) => {
    const b = document.createElement("button");
    const key = (i + 1).toString();
    // Try .jpg first, fall back to .png; hide the <img> if neither exists.
    b.innerHTML = `
      <img class="ref" src="/static/reference/${cls}.jpg"
           onerror="this.onerror=null; this.src='/static/reference/${cls}.png'; this.addEventListener('error', () => { this.outerHTML = '<div class=\\'ref-placeholder\\'>no ref</div>'; }, { once: true });">
      <div class="label-row"><span class="key">${key}</span>${cls}</div>`;
    b.onclick = () => label(cls);
    wrap.appendChild(b);
  });
  document.getElementById("undo").onclick = undo;

  document.addEventListener("keydown", (e) => {
    if (e.key === "u" || e.key === "U") { undo(); return; }
    const idx = parseInt(e.key, 10);
    if (!isNaN(idx) && idx >= 1 && idx <= CLASSES.length) {
      label(CLASSES[idx - 1]);
    }
  });
}

buildButtons();
refillQueue().then(() => {
  fetch("/api/stats").then(r => r.json()).then(j => updateStats(j.remaining, j.counts));
  showNext();
});
</script>
</body>
</html>
