name: yolo_n_default
model_type: yolo_cls
pretrained: yolo11n-cls.pt
data_dir: labels_split
epochs: 50
imgsz: 224
batch: 32
lr0: 0.01
patience: 20
seed: 42
device: mps
aug:
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  fliplr: 0.0
  flipud: 0.0
  mosaic: 0.0
  erasing: 0.0
  cardinal_rotation: false
notes: |
  Baseline: yolo11n-cls, no extra rotation, no flips, default ultralytics aug.
